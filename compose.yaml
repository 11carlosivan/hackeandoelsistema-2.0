services:
  mysql:
    image: mysql:8.4
    container_name: hackeando-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hackeandoelsistema
      MYSQL_USER: hackeando
      MYSQL_PASSWORD: hackeando
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hackeando_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hackeando_mysql_data:
